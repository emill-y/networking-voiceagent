<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nomi · Early access</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FAF9F6;color:#5E5B55;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
<script>
  // Early access: remember this browser so /app opens instead of the waitlist.
  // /nomi-beta?off turns it back off.
  (function () {
    var off = location.search.indexOf("off") !== -1;
    document.cookie = off
      ? "nomi_beta=; Path=/; Max-Age=0; SameSite=Lax"
      : "nomi_beta=1; Path=/; Max-Age=31536000; SameSite=Lax; Secure";
    location.replace(off ? "/" : "/app");
  })();
</script>
</head>
<body><p>Opening Nomi…</p></body>
</html>
